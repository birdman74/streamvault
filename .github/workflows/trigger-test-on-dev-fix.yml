name: Trigger Test — Dev Pushed Fix to Open PR

on:
  push:
    branches: ['feature/story-*']
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Story ID (e.g. story-002)'
        required: true
      feature_branch:
        description: 'Feature branch name'
        required: true
      pr_number:
        description: 'Pull request number'
        required: true

jobs:
  trigger-test-on-dev-fix:
    permissions:
      contents: read
    runs-on: self-hosted
    if: github.actor == 'briankcampbell-streamvault-bot' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identify commit author and context
        id: context
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            STORY_ID="${{ github.event.inputs.story_id }}"
            BRANCH="${{ github.event.inputs.feature_branch }}"
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
            COMMIT_AUTHOR="claude-streamvault-dev"
          else
            COMMIT_AUTHOR=$(git log -1 --format='%an')
            BRANCH="${{ github.ref_name }}"
            STORY_ID=$(echo "$BRANCH" | grep -oP 'story-\d+')
            PR_NUMBER=""
          fi
          echo "commit_author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          echo "story_id=$STORY_ID" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "Commit author: $COMMIT_AUTHOR, Story: $STORY_ID, Branch: $BRANCH"

      - name: Check commit author is Dev persona
        id: author_check
        run: |
          if [ "${{ steps.context.outputs.commit_author }}" == "claude-streamvault-dev" ]; then
            echo "is_dev=true" >> $GITHUB_OUTPUT
          else
            echo "is_dev=false" >> $GITHUB_OUTPUT
            echo "Commit author is not claude-streamvault-dev — skipping."
          fi

      - name: Check open PR exists for this branch
        id: pr_check
        if: steps.author_check.outputs.is_dev == 'true' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.STREAMVAULT_BOT_GH_TOKEN }}
          BRANCH: ${{ steps.context.outputs.branch }}
        run: |
          PR_DATA=$(gh pr list --head "$BRANCH" --state open --json number 2>/dev/null)
          PR_NUMBER=$(echo "$PR_DATA" | jq -r '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "has_open_pr=false" >> $GITHUB_OUTPUT
          else
            echo "has_open_pr=true" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi

      - name: Launch Test persona for re-verification
        if: |
          steps.author_check.outputs.is_dev == 'true' &&
          (github.event_name == 'workflow_dispatch' || steps.pr_check.outputs.has_open_pr == 'true')
        env:
          STORY_ID: ${{ steps.context.outputs.story_id }}
          FEATURE_BRANCH: ${{ steps.context.outputs.branch }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number || steps.pr_check.outputs.pr_number }}
        run: |
          /home/brian/bin/streamvault-test-auto.sh "Dev has pushed a fix to $FEATURE_BRANCH for $STORY_ID on PR #$PR_NUMBER. Execute Phase 3 of your workflow per your CLAUDE.md: pull the branch, run the full suite, post updated PR comment, submit gh pr review."