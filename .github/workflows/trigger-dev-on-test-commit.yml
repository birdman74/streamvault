name: Trigger Dev — Test Committed Failing Tests After Changes Requested

on:
  push:
    branches: ['feature/story-*']
    paths:
      - '**/src/test/**'
      - '**/__tests__/**'
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Story ID (e.g. story-002)'
        required: true
      feature_branch:
        description: 'Feature branch name'
        required: true
      pr_number:
        description: 'Pull request number'
        required: true

jobs:
  trigger-dev-on-test-commit:
    permissions:
      contents: read
    runs-on: self-hosted
    if: github.actor == 'birdman74' || github.actor == 'briankcampbell-streamvault-bot' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identify commit author and context
        id: context
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            STORY_ID="${{ github.event.inputs.story_id }}"
            BRANCH="${{ github.event.inputs.feature_branch }}"
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
            COMMIT_AUTHOR="claude-streamvault-test"
          else
            COMMIT_AUTHOR=$(git log -1 --format='%an')
            BRANCH="${{ github.ref_name }}"
            STORY_ID=$(echo "$BRANCH" | grep -oP 'story-\d+')
            PR_NUMBER=""
          fi
          echo "commit_author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          echo "story_id=$STORY_ID" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "Commit author: $COMMIT_AUTHOR, Story: $STORY_ID, Branch: $BRANCH"

      - name: Check commit author is Test persona
        id: author_check
        run: |
          if [ "${{ steps.context.outputs.commit_author }}" == "claude-streamvault-test" ]; then
            echo "is_test=true" >> $GITHUB_OUTPUT
          else
            echo "is_test=false" >> $GITHUB_OUTPUT
            echo "Commit author is not claude-streamvault-test — skipping."
          fi

      - name: Check PR has changes_requested state
        id: pr_check
        if: steps.author_check.outputs.is_test == 'true' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.STREAMVAULT_BOT_GH_TOKEN }}
          BRANCH: ${{ steps.context.outputs.branch }}
        run: |
          PR_DATA=$(gh pr list --head "$BRANCH" --state open --json number,reviews 2>/dev/null)
          PR_NUMBER=$(echo "$PR_DATA" | jq -r '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "has_changes_requested=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          HAS_CR=$(echo "$PR_DATA" | jq -r '.[0].reviews[] | select(.state == "CHANGES_REQUESTED") | .state' | head -1)
          if [ -n "$HAS_CR" ]; then
            echo "has_changes_requested=true" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          else
            echo "has_changes_requested=false" >> $GITHUB_OUTPUT
          fi

      - name: Launch Dev persona to fix implementation
        if: |
          steps.author_check.outputs.is_test == 'true' &&
          (github.event_name == 'workflow_dispatch' || steps.pr_check.outputs.has_changes_requested == 'true')
        env:
          STORY_ID: ${{ steps.context.outputs.story_id }}
          FEATURE_BRANCH: ${{ steps.context.outputs.branch }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number || steps.pr_check.outputs.pr_number }}
        run: |
          /home/brian/bin/streamvault-dev-auto.sh "Test has committed failing tests to branch $FEATURE_BRANCH for $STORY_ID on PR #$PR_NUMBER. Pull the latest branch, read the new failing tests, fix the implementation until all tests pass, run mvn clean verify, commit the fix, and push to origin/$FEATURE_BRANCH. Do not open a new PR."