# Guard pattern: see docs/adr/ADR-002-push-trigger-guard-pattern.md
name: Trigger Dev - Test Plan Ready for Review

on:
  push:
    branches: ['feature/story-*']
    paths:
      - 'docs/specs/design/story-*-test-plan.md'
      - 'docs/specs/design/story-*-test-revision-r*.md'
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Story ID (e.g. story-002)'
        required: true
      feature_branch:
        description: 'Feature branch name'
        required: true
      review_round:
        description: 'Review round number (1, 2, or 3)'
        required: true
        default: '1'

jobs:
  trigger-dev-review:
    permissions:
      contents: read
    runs-on: self-hosted
    if: github.actor == 'birdman74' || github.actor == 'briankcampbell-streamvault-bot' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identify commit author and context
        id: context
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            STORY_ID="${{ github.event.inputs.story_id }}"
            BRANCH="${{ github.event.inputs.feature_branch }}"
            ROUND="${{ github.event.inputs.review_round }}"
            COMMIT_AUTHOR="claude-streamvault-test"
          else
            COMMIT_AUTHOR=$(git log -1 --format='%an')
            BRANCH="${{ github.ref_name }}"
            STORY_ID=$(echo "$BRANCH" | grep -oP 'story-\d+')
            ROUND=1
            for i in 1 2 3; do
              if [ -f "docs/specs/design/${STORY_ID}-dev-feedback-r${i}.md" ]; then
                ROUND=$((i + 1))
              fi
            done
          fi
          echo "commit_author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          echo "story_id=$STORY_ID" >> $GITHUB_OUTPUT
          echo "round=$ROUND" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Commit author: $COMMIT_AUTHOR, Story: $STORY_ID, Review round: $ROUND, Branch: $BRANCH"

      - name: Check commit author is Test persona
        id: author_check
        run: |
          if [ "${{ steps.context.outputs.commit_author }}" == "claude-streamvault-test" ]; then
            echo "is_test=true" >> $GITHUB_OUTPUT
          else
            echo "is_test=false" >> $GITHUB_OUTPUT
            echo "Commit author is not claude-streamvault-test - skipping."
          fi

      - name: Check review not already resolved
        id: state_check
        if: steps.author_check.outputs.is_test == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          STORY_ID="${{ steps.context.outputs.story_id }}"
          if [ -f "docs/specs/design/${STORY_ID}-agreed.md" ]; then
            echo "needs_review=false" >> $GITHUB_OUTPUT
            echo "docs/specs/design/${STORY_ID}-agreed.md already exists - design already agreed, skipping."
          else
            echo "needs_review=true" >> $GITHUB_OUTPUT
          fi

      - name: Check iteration limit
        id: limit_check
        if: |
          steps.author_check.outputs.is_test == 'true' &&
          (github.event_name == 'workflow_dispatch' || steps.state_check.outputs.needs_review == 'true')
        run: |
          if [ "${{ steps.context.outputs.round }}" -gt 3 ]; then
            echo "limit_reached=true" >> $GITHUB_OUTPUT
          else
            echo "limit_reached=false" >> $GITHUB_OUTPUT
          fi

      - name: Escalate to Brian if iteration limit reached
        if: |
          steps.author_check.outputs.is_test == 'true' &&
          (github.event_name == 'workflow_dispatch' || steps.state_check.outputs.needs_review == 'true') &&
          steps.limit_check.outputs.limit_reached == 'true'
        env:
          GH_TOKEN: ${{ secrets.STREAMVAULT_BOT_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STORY_ID: ${{ steps.context.outputs.story_id }}
          BRANCH: ${{ steps.context.outputs.branch }}
          STAGE: design iteration limit reached
          REASON: "Test and Dev completed 3 design rounds without agreement. Review docs/specs/design/ on the branch. To proceed, commit the agreed design yourself and then run 'Trigger Dev - Agreed Design, Begin Implementation' manually (a commit by you does not trigger it automatically)."
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          chmod +x scripts/escalate-to-brian.sh
          ./scripts/escalate-to-brian.sh
          # Red run: the pipeline is stopped until Brian acts
          exit 1

      - name: Record state before launch
        id: pre
        if: |
          steps.author_check.outputs.is_test == 'true' &&
          (github.event_name == 'workflow_dispatch' || steps.state_check.outputs.needs_review == 'true') &&
          steps.limit_check.outputs.limit_reached == 'false'
        env:
          GH_TOKEN: ${{ secrets.STREAMVAULT_BOT_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STORY_ID: ${{ steps.context.outputs.story_id }}
          BRANCH: ${{ steps.context.outputs.branch }}
        run: |
          # Backdated 60s so runner/GitHub clock skew cannot hide activity
          echo "started_at=$(date -u -d '-60 seconds' +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          chmod +x scripts/persona-outcome-check.sh
          HEAD_SHA_BEFORE=$(./scripts/persona-outcome-check.sh head-sha "$BRANCH")
          echo "head_sha=$HEAD_SHA_BEFORE" >> $GITHUB_OUTPUT
          echo "Head of $BRANCH before launch: $HEAD_SHA_BEFORE"

      - name: Launch Dev persona for review
        id: launch
        # Step timeout counts as a failure (escalates); the 6h job timeout is a
        # cancellation, which would skip escalation entirely.
        timeout-minutes: 180
        if: |
          steps.author_check.outputs.is_test == 'true' &&
          (github.event_name == 'workflow_dispatch' || steps.state_check.outputs.needs_review == 'true') &&
          steps.limit_check.outputs.limit_reached == 'false'
        env:
          STORY_ID: ${{ steps.context.outputs.story_id }}
          REVIEW_ROUND: ${{ steps.context.outputs.round }}
          FEATURE_BRANCH: ${{ steps.context.outputs.branch }}
        run: |
          /home/brian/bin/streamvault-dev-auto.sh "Test has committed a design artifact to feature branch $FEATURE_BRANCH for $STORY_ID. This is review round $REVIEW_ROUND. Read docs/specs/design/$STORY_ID-test-plan.md, $STORY_ID-api-contracts.md, and all revision files up to this round. Then read every test file Test has committed on this branch and run the Test Code Conformance check from your CLAUDE.md: every constructor, method signature, endpoint, DTO and status code the tests use must match the current contracts. Execute your design review phase per your CLAUDE.md: commit $STORY_ID-agreed.md only if the design is sound AND the test code conforms to the contracts (fill in the Test Code Conformance section); otherwise commit $STORY_ID-dev-feedback-r${REVIEW_ROUND}.md with specific actionable concerns, listing each test/contract mismatch as its own concern. Commit and push to origin/$FEATURE_BRANCH." 2>&1 | tee "$RUNNER_TEMP/persona-output.log"

      - name: Verify persona produced the expected outcome
        id: outcome
        if: ${{ !cancelled() && (steps.launch.outcome != 'skipped' || steps.pre.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ secrets.STREAMVAULT_BOT_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STORY_ID: ${{ steps.context.outputs.story_id }}
          BRANCH: ${{ steps.context.outputs.branch }}
          STARTED_AT: ${{ steps.pre.outputs.started_at }}
          HEAD_SHA_BEFORE: ${{ steps.pre.outputs.head_sha }}
          ROUND: ${{ steps.context.outputs.round }}
          LAUNCH_OUTCOME: ${{ steps.launch.outcome }}
        run: |
          chmod +x scripts/persona-outcome-check.sh
          # Retry: GitHub can take a moment to reflect the persona's final push
          for i in 1 2 3; do
            sleep 20
            CHECK_RESULT=$( { ./scripts/persona-outcome-check.sh branch-advanced "$BRANCH" "$HEAD_SHA_BEFORE" claude-streamvault-dev && ./scripts/persona-outcome-check.sh file-on-branch "$BRANCH" "docs/specs/design/${STORY_ID}-agreed.md" "docs/specs/design/${STORY_ID}-dev-feedback-r${ROUND}.md"; } 2>&1 ) && CHECK_CODE=0 || CHECK_CODE=$?
            [ $CHECK_CODE -eq 0 ] && break
            echo "Check attempt $i: $CHECK_RESULT"
          done
          echo "$CHECK_RESULT"
          REASON=$(echo "$CHECK_RESULT" | tr '\n' ' ')
          if [ "$LAUNCH_OUTCOME" != "success" ]; then
            REASON="Persona was not launched, its launcher failed, or it timed out (launch step: ${LAUNCH_OUTCOME:-not run}). If it timed out, its container may still be running: check docker ps on BRIAN-2025. Outcome check: $REASON"
            CHECK_CODE=1
          fi
          echo "reason=$REASON" >> $GITHUB_OUTPUT
          exit $CHECK_CODE

      - name: Escalate to Brian
        if: ${{ !cancelled() && steps.outcome.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.STREAMVAULT_BOT_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STORY_ID: ${{ steps.context.outputs.story_id }}
          BRANCH: ${{ steps.context.outputs.branch }}
          STAGE: Dev design review stalled
          REASON: ${{ steps.outcome.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTPUT_FILE: ${{ runner.temp }}/persona-output.log
        run: |
          chmod +x scripts/escalate-to-brian.sh
          ./scripts/escalate-to-brian.sh