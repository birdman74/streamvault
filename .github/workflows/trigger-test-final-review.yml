name: Trigger Test - Final PR Review

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Story ID (e.g. story-002)'
        required: true
      feature_branch:
        description: 'Feature branch name (e.g. feature/story-002-google-oauth)'
        required: true
      pr_number:
        description: 'Pull request number'
        required: true

jobs:
  trigger-test-review:
    permissions:
      contents: read
    runs-on: self-hosted
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.actor == 'briankcampbell-streamvault-bot' &&
        startsWith(github.head_ref, 'feature/')
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identify story from branch name
        id: context
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            STORY_ID="${{ github.event.inputs.story_id }}"
            BRANCH="${{ github.event.inputs.feature_branch }}"
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
          else
            BRANCH="${{ github.head_ref }}"
            STORY_ID=$(echo "$BRANCH" | grep -oP 'story-\d+')
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          echo "story_id=$STORY_ID" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Final review triggered for $STORY_ID - PR #$PR_NUMBER"

      - name: Record state before launch
        id: pre
        env:
          GH_TOKEN: ${{ secrets.STREAMVAULT_BOT_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STORY_ID: ${{ steps.context.outputs.story_id }}
          BRANCH: ${{ steps.context.outputs.branch }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          # Backdated 60s so runner/GitHub clock skew cannot hide activity
          echo "started_at=$(date -u -d '-60 seconds' +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Launch Test persona for final review
        id: launch
        # Step timeout counts as a failure (escalates); the 6h job timeout is a
        # cancellation, which would skip escalation entirely.
        timeout-minutes: 180
        env:
          STORY_ID: ${{ steps.context.outputs.story_id }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          FEATURE_BRANCH: ${{ steps.context.outputs.branch }}
        run: |
          echo "Launching Test persona for final review of $STORY_ID PR #$PR_NUMBER..."
          /home/brian/bin/streamvault-test-auto.sh "Dev has opened PR #$PR_NUMBER for $STORY_ID on branch $FEATURE_BRANCH. Execute Phase 3 (final verification) per your CLAUDE.md: pull the branch, run the full test suite, analyze the diff for regressions, and verify every AC-N criterion is covered by a passing test. Commit and push any new regression or failing tests FIRST. Then, as your final action, post your Test Run Summary as a PR comment (gh pr comment $PR_NUMBER --body-file <file>) whose first line is exactly <!-- test-verdict: APPROVED --> or <!-- test-verdict: CHANGES_REQUESTED -->. Do not run gh pr review: the bot account opened this PR and cannot review it. A CHANGES_REQUESTED verdict comment automatically wakes Dev." 2>&1 | tee "$RUNNER_TEMP/persona-output.log"

      - name: Verify persona produced the expected outcome
        id: outcome
        if: ${{ !cancelled() && (steps.launch.outcome != 'skipped' || steps.pre.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ secrets.STREAMVAULT_BOT_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STORY_ID: ${{ steps.context.outputs.story_id }}
          BRANCH: ${{ steps.context.outputs.branch }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          STARTED_AT: ${{ steps.pre.outputs.started_at }}
          HEAD_SHA_BEFORE: ${{ steps.pre.outputs.head_sha }}
          LAUNCH_OUTCOME: ${{ steps.launch.outcome }}
        run: |
          chmod +x scripts/persona-outcome-check.sh
          # Retry: GitHub can take a moment to reflect the persona's final push
          for i in 1 2 3; do
            sleep 20
            CHECK_RESULT=$( { ./scripts/persona-outcome-check.sh verdict-since "$PR_NUMBER" "$STARTED_AT" briankcampbell-streamvault-bot ANY; } 2>&1 ) && CHECK_CODE=0 || CHECK_CODE=$?
            [ $CHECK_CODE -eq 0 ] && break
            echo "Check attempt $i: $CHECK_RESULT"
          done
          echo "$CHECK_RESULT"
          REASON=$(echo "$CHECK_RESULT" | tr '\n' ' ')
          if [ "$LAUNCH_OUTCOME" != "success" ]; then
            REASON="Persona was not launched, its launcher failed, or it timed out (launch step: ${LAUNCH_OUTCOME:-not run}). If it timed out, its container may still be running: check docker ps on BRIAN-2025. Outcome check: $REASON"
            CHECK_CODE=1
          fi
          echo "reason=$REASON" >> $GITHUB_OUTPUT
          exit $CHECK_CODE

      - name: Escalate to Brian
        if: ${{ !cancelled() && steps.outcome.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.STREAMVAULT_BOT_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STORY_ID: ${{ steps.context.outputs.story_id }}
          BRANCH: ${{ steps.context.outputs.branch }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          STAGE: Test final review stalled
          REASON: ${{ steps.outcome.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTPUT_FILE: ${{ runner.temp }}/persona-output.log
        run: |
          chmod +x scripts/escalate-to-brian.sh
          ./scripts/escalate-to-brian.sh