# Keeps the StreamVault project board in step with each story issue.
# Logic lives in scripts/sync-project-board.sh, which reads the issue's LIVE
# state from the API, so a queued or out-of-order run can never move a
# closed story back to Ready.
#
# Fires on every issue event that can change a story's column (including the
# label edits made by sync-blocked-labels.yml and pipeline-main-and-merge.yml),
# and on manual dispatch: one issue, or every story issue when the issue
# number is left blank, with an optional dry run.
#
# Board, field and column names: .github/pipeline-config.env.
# Token: PROJECT_BOARD_GH_TOKEN, a classic PAT from birdman74 with 'project'
# and 'repo' scopes. GITHUB_TOKEN and fine-grained PATs cannot reach a
# user-owned Projects V2 board (they silently find no item).
#
# No push trigger, so ADR-002 does not apply. Runs on a GitHub-hosted runner
# so it never waits behind a persona run on the self-hosted runner.
name: Sync Project Board Status

on:
  issues:
    types: [opened, labeled, unlabeled, closed, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to sync (leave blank to sync every story issue)'
        required: false
      dry_run:
        description: 'Dry run: report moves only, change nothing'
        type: boolean
        required: false
        default: false

# One queue per issue: a newer event for the same issue replaces a pending
# one (both read live state, so nothing is lost), and events for different
# issues never cancel each other.
concurrency:
  group: sync-project-board-${{ github.event.issue.number || github.event.inputs.issue_number || 'all' }}
  cancel-in-progress: false

jobs:
  sync-board:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'story')

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Wait for GitHub API to reflect the issue change
        if: github.event_name == 'issues'
        run: sleep "$(bash scripts/pipeline-config.sh get API_PROPAGATION_WAIT_SECONDS)"

      - name: Sync board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_BOARD_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
        run: |
          chmod +x scripts/*.sh
          # Board title, Status field and column names come from the config
          source scripts/pipeline-config.sh
          if [ -n "$ISSUE_NUMBER" ]; then
            ./scripts/sync-project-board.sh "$ISSUE_NUMBER"
          else
            ./scripts/sync-project-board.sh --all
          fi