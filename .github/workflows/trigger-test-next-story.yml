# Guard pattern: see docs/adr/ADR-002-push-trigger-guard-pattern.md
name: Trigger Test - Next Story from Queue

on:
  push:
    branches: [main]
    paths:
      - 'docs/specs/story-*.md'
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Force a specific story ID (leave blank to use queue manager)'
        required: false

jobs:
  queue-next-story:
    permissions:
      contents: read
    runs-on: self-hosted
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.actor == 'birdman74' || github.actor == 'briankcampbell-streamvault-bot')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify a story file actually changed in this push
        id: file_check
        if: github.event_name == 'push'
        run: |
          # First-parent diff (ADR-002): lists the files this commit brought
          # into main. Works for regular, squash and merge commits alike.
          # git diff-tree without -m lists nothing for a merge commit, so it
          # silently skipped every spec change merged through a PR.
          CHANGED=$(git diff --name-only ${{ github.sha }}^1 ${{ github.sha }} | grep -E '^docs/specs/story-.*\.md$' || true)
          if [ -z "$CHANGED" ]; then
            echo "story_file_changed=false" >> $GITHUB_OUTPUT
            echo "No story spec files in the actual pushed commit (path filter matched on stale range, likely a force-push) - skipping."
          else
            echo "story_file_changed=true" >> $GITHUB_OUTPUT
            echo "Story files changed: $CHANGED"
          fi

      - name: Reconcile blocked labels after spec change
        if: github.event_name == 'push' && steps.file_check.outputs.story_file_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.QUEUE_MANAGER_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          chmod +x scripts/check-prerequisites.sh scripts/sync-blocked-labels.sh
          ./scripts/sync-blocked-labels.sh

      - name: Close completed story issue
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.merged == true &&
          startsWith(github.event.pull_request.head.ref, 'feature/')
        env:
          GH_TOKEN: ${{ secrets.QUEUE_MANAGER_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          STORY_ID=$(echo "$BRANCH" | grep -oP 'story-\d+' | head -1)

          if [ -z "$STORY_ID" ]; then
            echo "Could not extract story ID from branch $BRANCH - skipping issue close."
            exit 0
          fi

          # Find the issue for this story (word-boundary match, so story-01
          # can never match story-010)
          ISSUE_NUMBER=$(gh issue list \
            --label "story" \
            --state open \
            --limit 500 \
            --json number,title \
            | jq -r --arg id "$STORY_ID" '[.[] | select(.title | test("\\b" + $id + "\\b")) | .number][0] // empty')

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No open issue found for $STORY_ID - may have already been closed."
            exit 0
          fi

          # Remove in-progress. A 404 means it is already gone, which is the
          # desired end state, so it must not stop the issue from closing.
          if ! API_RESPONSE=$(gh api --method DELETE \
              "repos/{owner}/{repo}/issues/$ISSUE_NUMBER/labels/in-progress" 2>&1); then
            if echo "$API_RESPONSE" | grep -q "HTTP 404"; then
              echo "'in-progress' was already removed from #$ISSUE_NUMBER"
            else
              echo "$API_RESPONSE" >&2
              exit 1
            fi
          fi

          # Closed as completed: this is what unblocks dependent stories
          gh issue close "$ISSUE_NUMBER" --reason completed --comment "Completed - PR merged to main."
          echo "Closed issue #$ISSUE_NUMBER for $STORY_ID"

      - name: Wait for GitHub API to reflect issue close
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        run: sleep 30

      - name: Determine next story
        id: queue
        if: |
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && steps.file_check.outputs.story_file_changed == 'true') ||
          (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'feature/'))
        env:
          GH_TOKEN: ${{ secrets.QUEUE_MANAGER_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.story_id }}" ]; then
            NEXT_STORY="${{ github.event.inputs.story_id }}"
            echo "Manual override - using story: $NEXT_STORY"
            echo "next_story=$NEXT_STORY" >> $GITHUB_OUTPUT
            exit 0
          fi

          chmod +x scripts/next-story.sh scripts/check-prerequisites.sh

          # Actions runs this step with bash -e, so capture the exit code
          # explicitly; a bare assignment would abort the step on any
          # non-zero exit before the code could be inspected.
          NEXT_STORY=$(./scripts/next-story.sh) && EXIT_CODE=0 || EXIT_CODE=$?

          if [ $EXIT_CODE -eq 3 ]; then
            # Normal when a spec lands on main while a story is being worked.
            # The queue picks up again when that story's PR merges.
            echo "::notice::A story is already in-progress - nothing to start."
            echo "next_story=" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Queue manager failed (exit $EXIT_CODE) - see log above."
            exit 1
          fi

          if [ -z "$NEXT_STORY" ]; then
            echo "No eligible story found in queue - nothing to start."
            echo "next_story=" >> $GITHUB_OUTPUT
          else
            echo "Next eligible story: $NEXT_STORY"
            echo "next_story=$NEXT_STORY" >> $GITHUB_OUTPUT
          fi

      - name: Mark next story as in-progress
        if: steps.queue.outputs.next_story != ''
        env:
          GH_TOKEN: ${{ secrets.QUEUE_MANAGER_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          STORY_ID="${{ steps.queue.outputs.next_story }}"

          ISSUE_NUMBER=$(gh issue list \
            --label "story" \
            --state open \
            --limit 500 \
            --json number,title \
            | jq -r --arg id "$STORY_ID" '[.[] | select(.title | test("\\b" + $id + "\\b")) | .number][0] // empty')

          if [ -n "$ISSUE_NUMBER" ]; then
            gh api \
              --method POST \
              "repos/{owner}/{repo}/issues/$ISSUE_NUMBER/labels" \
              -f 'labels[]=in-progress' > /dev/null
            echo "Marked issue #$ISSUE_NUMBER as in-progress"
          else
            echo "WARNING: No open issue found for $STORY_ID"
          fi

      - name: Find story file path
        id: story_file
        if: steps.queue.outputs.next_story != ''
        run: |
          STORY_FILE=$(ls docs/specs/${{ steps.queue.outputs.next_story }}-*.md 2>/dev/null | head -1)
          echo "story_file=$STORY_FILE" >> $GITHUB_OUTPUT

      - name: Record state before launch
        id: pre
        if: steps.queue.outputs.next_story != ''
        env:
          GH_TOKEN: ${{ secrets.STREAMVAULT_BOT_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STORY_ID: ${{ steps.queue.outputs.next_story }}
        run: |
          # Backdated 60s so runner/GitHub clock skew cannot hide activity
          echo "started_at=$(date -u -d '-60 seconds' +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          # If the story branch already exists (e.g. a manual restart), the check
          # must see NEW commits on it, not just that it exists.
          EXISTING_BRANCH=$(gh api "repos/$GH_REPO/git/matching-refs/heads/feature/${STORY_ID}-" --jq '.[0].ref // ""' | sed 's|^refs/heads/||')
          echo "existing_branch=$EXISTING_BRANCH" >> $GITHUB_OUTPUT
          if [ -n "$EXISTING_BRANCH" ]; then
            chmod +x scripts/persona-outcome-check.sh
            echo "head_sha=$(./scripts/persona-outcome-check.sh head-sha "$EXISTING_BRANCH")" >> $GITHUB_OUTPUT
            echo "Branch $EXISTING_BRANCH already exists; Test must push new commits to it"
          fi

      - name: Launch Test persona for next story
        id: launch
        # Step timeout counts as a failure (escalates); the 6h job timeout is a
        # cancellation, which would skip escalation entirely.
        timeout-minutes: 180
        if: steps.queue.outputs.next_story != ''
        env:
          STORY_ID: ${{ steps.queue.outputs.next_story }}
          STORY_FILE: ${{ steps.story_file.outputs.story_file }}
        run: |
          echo "Launching Test persona for $STORY_ID..."
          /home/brian/bin/streamvault-test-auto.sh "A new user story is ready to begin. Read the story file $STORY_FILE and execute Phase 1 of your workflow: create the feature branch feature/${STORY_ID}-short-kebab-case-description, write the test plan, define API contracts, write failing automated tests, commit all artifacts to the feature branch, and push the branch to origin - per your CLAUDE.md instructions." 2>&1 | tee "$RUNNER_TEMP/persona-output.log"

      - name: Verify persona produced the expected outcome
        id: outcome
        if: ${{ !cancelled() && (steps.launch.outcome != 'skipped' || steps.pre.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ secrets.STREAMVAULT_BOT_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STORY_ID: ${{ steps.queue.outputs.next_story }}
          STARTED_AT: ${{ steps.pre.outputs.started_at }}
          HEAD_SHA_BEFORE: ${{ steps.pre.outputs.head_sha }}
          EXISTING_BRANCH: ${{ steps.pre.outputs.existing_branch }}
          LAUNCH_OUTCOME: ${{ steps.launch.outcome }}
        run: |
          chmod +x scripts/persona-outcome-check.sh
          # Retry: GitHub can take a moment to reflect the persona's final push
          for i in 1 2 3; do
            sleep 20
            CHECK_RESULT=$( { if [ -n "$EXISTING_BRANCH" ]; then ./scripts/persona-outcome-check.sh branch-advanced "$EXISTING_BRANCH" "$HEAD_SHA_BEFORE" claude-streamvault-test; else ./scripts/persona-outcome-check.sh branch-created "$STORY_ID"; fi; } 2>&1 ) && CHECK_CODE=0 || CHECK_CODE=$?
            [ $CHECK_CODE -eq 0 ] && break
            echo "Check attempt $i: $CHECK_RESULT"
          done
          echo "$CHECK_RESULT"
          REASON=$(echo "$CHECK_RESULT" | tr '\n' ' ')
          if [ "$LAUNCH_OUTCOME" != "success" ]; then
            REASON="Persona was not launched, its launcher failed, or it timed out (launch step: ${LAUNCH_OUTCOME:-not run}). If it timed out, its container may still be running: check docker ps on BRIAN-2025. Outcome check: $REASON"
            CHECK_CODE=1
          fi
          echo "reason=$REASON" >> $GITHUB_OUTPUT
          exit $CHECK_CODE

      - name: Escalate to Brian
        if: ${{ !cancelled() && steps.outcome.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.STREAMVAULT_BOT_GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STORY_ID: ${{ steps.queue.outputs.next_story }}
          STAGE: Test story kickoff stalled
          REASON: ${{ steps.outcome.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTPUT_FILE: ${{ runner.temp }}/persona-output.log
        run: |
          chmod +x scripts/escalate-to-brian.sh
          ./scripts/escalate-to-brian.sh