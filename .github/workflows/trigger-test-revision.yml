name: Trigger Test — Dev Feedback Requires Revision

on:
  push:
    branches: ['feature/story-*']
    paths:
      - 'docs/specs/design/story-*-dev-feedback-r*.md'
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Story ID (e.g. story-002)'
        required: true
      feature_branch:
        description: 'Feature branch name (e.g. feature/story-002-google-oauth)'
        required: true
      revision_round:
        description: 'Revision round number (1, 2, or 3)'
        required: true
        default: '1'

jobs:
  trigger-test-revision:
    runs-on: self-hosted
    if: github.actor == 'birdman74' || github.actor == 'briankcampbell-streamvault-bot'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identify story and round
        id: context
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            STORY_ID="${{ github.event.inputs.story_id }}"
            BRANCH="${{ github.event.inputs.feature_branch }}"
            ROUND="${{ github.event.inputs.revision_round }}"
          else
            CHANGED=$(echo '${{ toJson(github.event.commits) }}' | \
              grep -oP 'docs/specs/design/story-\d+[^"]*\.md' | head -1)
            STORY_ID=$(echo "$CHANGED" | grep -oP 'story-\d+')
            ROUND=$(echo "$CHANGED" | grep -oP 'r\d+' | grep -oP '\d+')
            BRANCH="${{ github.ref_name }}"
          fi

          echo "story_id=$STORY_ID" >> $GITHUB_OUTPUT
          echo "round=$ROUND" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Story: $STORY_ID, Revision round: $ROUND, Branch: $BRANCH"

      - name: Launch Test persona for revision
        env:
          STORY_ID: ${{ steps.context.outputs.story_id }}
          REVISION_ROUND: ${{ steps.context.outputs.round }}
          FEATURE_BRANCH: ${{ steps.context.outputs.branch }}
        run: |
          echo "Launching Test persona for $STORY_ID revision round $REVISION_ROUND..."
          /home/brian/bin/streamvault-test-auto.sh "Dev has committed feedback file docs/specs/design/$STORY_ID-dev-feedback-r${REVISION_ROUND}.md on branch $FEATURE_BRANCH. Read Dev's concerns carefully and execute your revision phase per your CLAUDE.md: revise the test plan and contracts where Dev's feedback is technically valid without dropping AC coverage, then commit $STORY_ID-test-revision-r${REVISION_ROUND}.md and push to origin/$FEATURE_BRANCH."