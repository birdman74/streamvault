name: Trigger Test — New Story Spec

on:
  push:
    branches: [main]
    paths:
      - 'docs/specs/story-*.md'
  workflow_dispatch:
    inputs:
      story_id:
        description: 'Story ID (e.g. story-002)'
        required: true
      story_file:
        description: 'Story spec file path (e.g. docs/specs/story-002-google-oauth.md)'
        required: true

jobs:
  trigger-test:
    runs-on: self-hosted
    if: github.actor == 'birdman74' || github.actor == 'briankcampbell-streamvault-bot'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identify new story file
        id: story
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            STORY_FILE="${{ github.event.inputs.story_file }}"
            STORY_ID="${{ github.event.inputs.story_id }}"
          else
            STORY_FILE=$(echo '${{ toJson(github.event.commits) }}' | \
              jq -r '.[].modified[], .[].added[] | select(test("docs/specs/story-[0-9]+-.*\\.md"))' 2>/dev/null | head -1)
            STORY_ID=$(echo "$STORY_FILE" | grep -oP 'story-\d+')
          fi

          if [ -z "$STORY_FILE" ]; then
            echo "No story file found — skipping."
            exit 0
          fi

          echo "story_file=$STORY_FILE" >> $GITHUB_OUTPUT
          echo "story_id=$STORY_ID" >> $GITHUB_OUTPUT
          echo "Detected story: $STORY_ID from $STORY_FILE"

      - name: Launch Test persona
        if: steps.story.outputs.story_id != ''
        env:
          STORY_ID: ${{ steps.story.outputs.story_id }}
          STORY_FILE: ${{ steps.story.outputs.story_file }}
        run: |
          echo "Launching Test persona for $STORY_ID..."
          /home/brian/bin/streamvault-test-auto.sh "A new user story has been committed to docs/specs/. Read the story file $STORY_FILE and execute Phase 1 of your workflow: create the feature branch feature/${STORY_ID}-short-kebab-case-description, write the test plan, define API contracts, write failing automated tests, commit all artifacts to the feature branch, and push the branch to origin — per your CLAUDE.md instructions."